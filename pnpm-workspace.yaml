packages:
  - "apps/*"
  - "packages/*"
overrides:
  esbuild@<0.25.0: ">=0.25.0"
  # Story 5.8: exceljs@4.4.0 pins uuid@^8.3.0, whose v4() has a moderate,
  # already-patched buffer-bounds-check finding (GHSA-w5hq-g745-h8pq) that
  # `pnpm audit` flags. uuid's v4() call shape (`uuidv4()`, no args) is
  # unchanged all the way through v11, so this override is safe -- same
  # "pin the transitive dependency forward to the patched range" precedent
  # as the existing esbuild@<0.25.0 override for drizzle-kit.
  uuid@<11.1.1: ">=11.1.1"
  # next@16.3.8's own bundled sharp (GHSA-wq5f-xc86-pv6w, librsvg
  # vulnerability) and multiple tailwindcss/next>postcss paths' source-map-js
  # (GHSA-68fv-2mgg-jv7q, event-loop DoS) both surfaced in `pnpm audit` after
  # the 2026-10-17 next 16.3.6 -> 16.3.8 bump (itself fixing 3 next CVEs) --
  # same "pin the transitive dependency forward to the patched range"
  # precedent as the existing esbuild/uuid overrides above.
  source-map-js@<1.2.2: ">=1.2.2"
  sharp@<0.35.5: ">=0.35.5"
allowBuilds:
  argon2: true
  # Story 5.8: core-js is jspdf's optional canvg (SVG-to-canvas) dependency
  # -- unused here (this story's PDF export only renders tables via
  # jspdf-autotable, never SVG/canvas content). Its postinstall script only
  # prints a donation banner, nothing this codebase needs to run.
  core-js: false
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@next/env@16.3.8'
  - '@next/eslint-plugin-next@16.3.8'
  - '@next/swc-darwin-arm64@16.3.8'
  - '@next/swc-darwin-x64@16.3.8'
  - '@next/swc-linux-arm64-gnu@16.3.8'
  - '@next/swc-linux-arm64-musl@16.3.8'
  - '@next/swc-linux-x64-gnu@16.3.8'
  - '@next/swc-linux-x64-musl@16.3.8'
  - '@next/swc-win32-arm64-msvc@16.3.8'
  - '@next/swc-win32-x64-msvc@16.3.8'
  - eslint-config-next@16.3.8
  - next@16.3.8
