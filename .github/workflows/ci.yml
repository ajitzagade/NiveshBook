name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgres://niveshbook:niveshbook_dev@localhost:5432/niveshbook

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: niveshbook
          POSTGRES_PASSWORD: niveshbook_dev
          POSTGRES_DB: niveshbook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U niveshbook -d niveshbook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (incl. import-boundary + security rules)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Dependency vulnerability audit
        run: pnpm audit
